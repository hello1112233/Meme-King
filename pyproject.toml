[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meme-king"
version = "0.1.0"
description = "Deterministic read-only Telegram intelligence observatory for historical Meme Queen/OpenClaw data."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["meme_king*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

